<!-- login.component.html -->
<div class="login-container">
  <h2>Вход</h2>
  
  <!-- Традиционная форма (опционально) -->
  <form (ngSubmit)="onSubmit()">
    <div class="form-group">
      <label>Имя пользователя</label>
      <input type="text" [(ngModel)]="name" name="name" class="form-control">
    </div>

    <div class="form-group">
      <label>Пароль</label>
      <input type="password" [(ngModel)]="password" name="password" class="form-control">
    </div>

    <button type="submit" class="btn btn-secondary">Войти</button>
  </form>

  <div class="divider">или</div>

  <!-- Кнопка для входа через Keycloak -->
  <button (click)="loginWithKeycloak()" class="btn btn-primary">
    Войти через Keycloak
  </button>
</div>
