<div class="container">
    <h1>{{ title }}</h1>
    
    <!-- Кнопка выбора файла -->
    <div>
        <input type="file" id="fileInput" accept=".txt" 
               (change)="onFileSelected($event)" style="display: none;">
        <button class="btn" (click)="triggerFileInput()">
            📄 Выбрать TXT-документ
        </button>
    </div>

    <!-- Блок для отображения содержимого -->
    <div *ngIf="isContentVisible" class="file-content">
        <pre>{{ fileContent }}</pre>
    </div>

    <!-- Кнопка перехода к авторизации -->
    <div>
        <a routerLink="/entrance" class="btn">🔐 Вход / Регистрация</a>
    </div>
</div>
